name: CI

on:
  - push
  - pull_request

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # DuckDB v2 C API has no stable release yet; setup-duckdb reads the nightly
  # staging release from .duckdb-release.
  # All features except capi-v2-p2, which is not ready to link yet.
  FEATURES: "bundled strict-docs"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: ./.github/actions/setup-duckdb

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --features "$FEATURES" --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --features "$FEATURES" --locked

      # Loadable extensions have not been migrated to the v2 C API yet.
      - name: Build loadable extension
        if: ${{ false }}
        run: cargo build --example hello-ext --features="loadable-extension"

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: ./.github/actions/setup-duckdb

      - name: Check rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --features "$FEATURES" --locked

  publish:
    name: Publish dry-run
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: ./.github/actions/setup-duckdb

      - name: Dry-run publish
        run: cargo publish --workspace --dry-run --features "$FEATURES" --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-bin: false
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-duckdb
      - uses: taiki-e/install-action@cargo-binstall
      - run: cargo binstall --no-confirm cargo-msrv
      - run: cargo msrv verify --path crates/duckdb
      - run: cargo msrv verify --path crates/libduckdb-sys

  sanitizer:
    name: Address Sanitizer
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-02
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: ./.github/actions/setup-duckdb

      - name: Tests with ASan
        env:
          RUSTFLAGS: -Zsanitizer=address -C debuginfo=0
          RUSTDOCFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_stack_use_after_return=1:detect_leaks=1:symbolize=1
        run: cargo test --lib --tests --features "$FEATURES" --package duckdb --locked
