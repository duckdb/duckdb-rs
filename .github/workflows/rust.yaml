name: CI v2

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # DuckDB v2 C API has no stable release yet; pin the main-branch commit whose
  # nightly staging artifacts we link against. Keep in sync with the tracked
  # duckdb-sources submodule commit.
  DUCKDB_SHA: d22e92fd82b9c964e05d31456e02ae979f043ccf
  # All features except capi-v2-p2, which is not ready to link yet.
  FEATURES: "bundled strict-docs"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      # Staging archives ship only the shared library; link against it dynamically.
      LINK_DUCKDB_BUNDLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: ./.github/actions/setup-duckdb

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --features "$FEATURES" --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --features "$FEATURES" --locked

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      LINK_DUCKDB_BUNDLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: ./.github/actions/setup-duckdb

      - name: Check rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --features "$FEATURES" --locked

  publish:
    name: Publish dry-run
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      LINK_DUCKDB_BUNDLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: ./.github/actions/setup-duckdb

      - name: Dry-run publish
        run: cargo publish --workspace --dry-run --features "$FEATURES" --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    env:
      LINK_DUCKDB_BUNDLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-bin: false
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-duckdb
      - uses: taiki-e/install-action@cargo-binstall
      - run: cargo binstall --no-confirm cargo-msrv
      - run: cargo msrv verify --path crates/duckdb
      - run: cargo msrv verify --path crates/libduckdb-sys

  sanitizer:
    name: Address Sanitizer
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      LINK_DUCKDB_BUNDLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-02
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: ./.github/actions/setup-duckdb

      - name: Tests with ASan
        env:
          RUSTFLAGS: -Zsanitizer=address -C debuginfo=0
          RUSTDOCFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_stack_use_after_return=1:detect_leaks=1:symbolize=1
        run: cargo test --lib --tests --features "$FEATURES" --package duckdb --locked
