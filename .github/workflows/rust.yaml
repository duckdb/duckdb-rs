name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    # DuckDB v2.0.0 release binaries are not published yet, so every job builds
    # the bundled backend. Restore DUCKDB_DOWNLOAD_LIB / DUCKDB_LIB_DIR coverage
    # once the release exists.
    name: Test ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: Windows, target: x86_64-pc-windows-msvc, os: windows-latest }
          - { name: Linux, target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10

      - run: cargo fmt --all -- --check
        if: matrix.os == 'ubuntu-latest'

      - name: run cargo clippy
        if: matrix.os == 'ubuntu-latest'
        # `bundled-cmake` is checkout-only and covered in the dedicated CMake job below.
        # extensions-full pulls in the bundled (cc) backend; wrap CC/CXX for sccache.
        env:
          CC: "sccache cc"
          CXX: "sccache c++"
        run: cargo clippy --all-targets --features "buildtime_bindgen extensions-full loadable-extension modern-full vscalar vscalar-arrow vtab-full" --locked -- -D warnings

      - name: Check rustdoc
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: -D warnings
        # Keep this feature list in sync with crates/duckdb/Cargo.toml [package.metadata.docs.rs].
        run: cargo doc --workspace --no-deps --features "modern-full vscalar vscalar-arrow vtab-full"

      - name: Dry-run release of crates
        if: matrix.os == 'ubuntu-latest'
        run: cargo publish --workspace --dry-run

      - name: Run cargo-test
        if: matrix.os == 'windows-latest'
        run: cargo test --features "bundled modern-full vscalar vtab-full"

      - name: Build loadable extension
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --example hello-ext --features="loadable-extension"

      - name: Build loadable extension (windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --example hello-ext --features="loadable-extension"

  cmake:
    name: Bundled CMake ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      DUCKDB_DISABLE_EXTENSION_LOAD: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10

      - name: Verify static linking with extension loading disabled
        shell: bash
        run: |
          output=$(cargo run -p duckdb --example repl --features icu -- -c "SELECT install_mode || ',' || install_path FROM duckdb_extensions() WHERE extension_name = 'icu';")
          echo "$output"
          grep -qF "STATICALLY_LINKED,(BUILT-IN)" <<<"$output"

          output=$(cargo run -p duckdb --example repl --features icu -- -c "SELECT current_setting('autoload_known_extensions') || ',' || current_setting('autoinstall_known_extensions');")
          echo "$output"
          grep -qF "false,false" <<<"$output"

          set +e
          output=$(cargo run -p duckdb --example repl --features icu -- -c "LOAD sqlite_scanner;" 2>&1)
          status=$?
          set -e

          echo "$output"
          test $status -ne 0
          grep -qF "Loading external extensions is disabled through a compile time flag" <<<"$output"

      - name: ICU functional test
        run: cargo test -p duckdb --features icu --lib extension::test::test_extension_icu -- --exact

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-bin: false
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cargo-binstall
      - run: cargo binstall --no-confirm cargo-msrv
      - run: cargo msrv verify --path crates/duckdb
      - run: cargo msrv verify --path crates/duckdb-loadable-macros
      - run: cargo msrv verify --path crates/duckdb-rs-neo
      - run: cargo msrv verify --path crates/libduckdb-sys

  sanitizer:
    name: Address Sanitizer
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-02 # 1.98.0
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Tests with asan
        env:
          # Always bundled until DuckDB v2.0.0 release binaries exist; PRs used
          # to download libduckdb for speed.
          ASAN_FEATURES: serde_json url r2d2 uuid polars vscalar vscalar-arrow extensions-full
          RUSTFLAGS: -Zsanitizer=address -C debuginfo=0
          RUSTDOCFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: "detect_stack_use_after_return=1:detect_leaks=1:symbolize=1"
          # extensions-full compiles the bundled (cc) backend; wrap CC/CXX
          # for sccache. Not ASAN-instrumented (RUSTFLAGS don't reach cc), so safe.
          CC: "sccache cc"
          CXX: "sccache c++"
        # We cannot run "modern-full" with asan as the chrono feature will auto-load release binaries of
        # the ICU-extension, which are not built with ASAN and will cause a crash.
        run: cargo test --lib --tests --features "${ASAN_FEATURES}" --target x86_64-unknown-linux-gnu --package duckdb --package duckdb-rs-neo
