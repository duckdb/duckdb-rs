name: Nightly
run-name: Nightly - ${{ inputs.duckdb-sha }} (${{ inputs.duckdb-version }})

on:
  # Dispatched by DuckDB's release dispatcher (duckdb/duckdb-workflow-trigger)
  # on its `core_ready` hook, which renders `duckdb-sha` from {duckdb_commit}
  # and `duckdb-version` from {duckdb_version}. This workflow must be listed in
  # that repository's endpoints.yml to receive events.
  workflow_dispatch:
    inputs:
      duckdb-sha:
        description: Full DuckDB commit SHA of the staging build to test against
        required: true
        type: string
      duckdb-version:
        description: DuckDB version label of that staging build (e.g. v2.0.0-alpha39998)
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ inputs.duckdb-sha }}
  cancel-in-progress: true

jobs:
  nightly:
    name: DuckDB nightly (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      DUCKDB_SHA: ${{ inputs.duckdb-sha }}
      DUCKDB_VERSION: ${{ inputs.duckdb-version }}
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # DuckDB's CMake build emits deep object paths that can exceed MAX_PATH
      # and fail with C1083. Keep Windows build output at the drive root.
      - name: Shorten Windows Cargo target directory
        if: ${{ runner.os == 'Windows' }}
        run: |
          case "$RUNNER_TEMP" in
            [A-Za-z]:[\\/]*) runner_drive=${RUNNER_TEMP%%:*} ;;
            *)
              echo "::error::Cannot derive a Windows drive from RUNNER_TEMP=$RUNNER_TEMP"
              exit 1
              ;;
          esac
          echo "CARGO_TARGET_DIR=$runner_drive:/t" >> "$GITHUB_ENV"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10

      # Point linked-mode builds at the staging build of the same commit, so the
      # build script's own download path (the default for users) is what gets
      # tested. The sync step below vendors the same commit from this pin.
      - name: Pin nightly staging build
        id: pin
        run: |
          [[ "$DUCKDB_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]] || {
            echo "::error::duckdb-version contains unsupported characters"
            exit 1
          }
          pin_file=crates/libduckdb-sys/.duckdb-release
          release_url="https://duckdb-staging.duckdb.org/${DUCKDB_SHA:0:10}/${DUCKDB_VERSION}/duckdb/duckdb/github_release"
          [[ "$DUCKDB_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::duckdb-sha must be the full 40-character commit SHA"
            exit 1
          }
          sed -i.bak "s|^DUCKDB_RELEASE_COMMIT=.*|DUCKDB_RELEASE_COMMIT=${DUCKDB_SHA}|; s|^DUCKDB_RELEASE_URL=.*|DUCKDB_RELEASE_URL=${release_url}|; s|^DUCKDB_RELEASE_VERSION=.*|DUCKDB_RELEASE_VERSION=${DUCKDB_VERSION}|" "$pin_file"
          rm -f "$pin_file.bak"
          grep '^DUCKDB_RELEASE' "$pin_file"
          curl --fail --head --location --retry 5 --silent --output /dev/null \
            "${release_url}/duckdb-shared-libs-linux-amd64.tar.gz" || {
            echo "::error::No staging artifacts at ${release_url}"
            exit 1
          }

      - name: Sync bundled DuckDB to the nightly pin
        id: upgrade
        run: ./upgrade.sh --sync

      - name: Show generated upgrade diff
        if: ${{ !cancelled() }}
        run: |
          git status --short
          git diff --stat

      - name: Test bundled backend
        if: ${{ !cancelled() && steps.upgrade.outcome == 'success' }}
        # cc crate ignores CMAKE_*_COMPILER_LAUNCHER; wrap CC/CXX for sccache.
        # Step-scoped so CC/CXX do not leak into cmake backend steps.
        # cc treats empty CC/CXX values as unset, preserving Windows discovery.
        env:
          CC: ${{ runner.os != 'Windows' && 'sccache cc' || '' }}
          CXX: ${{ runner.os != 'Windows' && 'sccache c++' || '' }}
        run: cargo test -p duckdb -p duckdb-rs-neo --features bundled

      - name: Test bundled-cmake backend
        if: ${{ !cancelled() && steps.upgrade.outcome == 'success' }}
        run: cargo test -p duckdb -p duckdb-rs-neo --features bundled-cmake

      # No DUCKDB_LIB_DIR: libduckdb-sys downloads the pinned staging archive,
      # which also carries duckdb.h and duckdb_v2.h for buildtime_bindgen.
      - name: Test downloaded nightly library and extensions
        if: ${{ !cancelled() && steps.pin.outcome == 'success' && steps.upgrade.outcome == 'success' }}
        # tests/nightly.rs holds exactly the ignored tests this workflow exists
        # to run. Selecting them with --ignored keeps a mistyped name from
        # passing silently, which is what an --exact filter would do.
        run: |
          cargo test -p duckdb --features buildtime_bindgen --test nightly -- --ignored
          cargo test -p duckdb -p duckdb-rs-neo --features buildtime_bindgen
