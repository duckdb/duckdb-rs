name: Nightly
run-name: Nightly - ${{ inputs.duckdb-sha }}

on:
  # Triggered from DuckDB's NotifyExternalRepositories workflow.
  # See https://github.com/duckdb/duckdb/pull/23352 for details.
  workflow_dispatch:
    inputs:
      duckdb-sha:
        description: DuckDB commit SHA to test against
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.duckdb-sha }}
  cancel-in-progress: true

jobs:
  nightly:
    name: DuckDB nightly
    runs-on: ubuntu-latest
    env:
      DUCKDB_SHA: ${{ inputs.duckdb-sha }}
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10

      - name: Upgrade bundled DuckDB to nightly commit
        id: upgrade
        run: ./upgrade.sh --sha "$DUCKDB_SHA"

      - name: Show generated upgrade diff
        if: always()
        run: |
          git status --short
          git diff --stat

      - name: Test bundled backend
        if: ${{ !cancelled() && steps.upgrade.outcome == 'success' }}
        # cc crate ignores CMAKE_*_COMPILER_LAUNCHER; wrap CC/CXX for sccache.
        # Step-scoped so CC/CXX do not leak into cmake backend steps.
        env:
          CC: "sccache cc"
          CXX: "sccache c++"
        run: cargo test -p duckdb --features bundled

      - name: Test bundled-cmake backend
        if: ${{ !cancelled() && steps.upgrade.outcome == 'success' }}
        run: cargo test -p duckdb --features bundled-cmake

      - name: Download nightly artifact
        id: artifact
        if: ${{ !cancelled() && steps.upgrade.outcome == 'success' }}
        run: |
          staging_key_length=10
          staging_key=${DUCKDB_SHA:0:$staging_key_length}
          artifact_url="https://duckdb-staging.duckdb.org/$staging_key/duckdb/duckdb/github_release/libduckdb-linux-amd64.zip"
          artifact_path="$RUNNER_TEMP/libduckdb-linux-amd64.zip"
          curl --fail --location --retry 5 --output "$artifact_path" "$artifact_url" || {
            echo "::error::No staging artifact at $artifact_url"
            exit 1
          }
          unzip -q "$artifact_path" -d "$RUNNER_TEMP/libduckdb"
          {
            echo "DUCKDB_LIB_DIR=$RUNNER_TEMP/libduckdb"
            echo "DUCKDB_INCLUDE_DIR=$RUNNER_TEMP/libduckdb"
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/libduckdb${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"

      - name: Test nightly artifact
        if: ${{ !cancelled() && steps.artifact.outcome == 'success' }}
        run: |
          cargo test -p duckdb --features buildtime_bindgen \
            --test nightly links_against_requested_duckdb_commit -- --exact --ignored
          cargo test -p duckdb --features buildtime_bindgen

      - name: Test nightly extension installation
        if: ${{ !cancelled() && steps.artifact.outcome == 'success' }}
        run: cargo test -p duckdb --features buildtime_bindgen
          --test nightly can_install_and_load_httpfs -- --exact --ignored
