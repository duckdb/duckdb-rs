name: Nightly
run-name: Nightly - ${{ inputs.duckdb-sha }}

on:
  # Triggered from DuckDB's NotifyExternalRepositories workflow.
  # See https://github.com/duckdb/duckdb/pull/23352 for details.
  workflow_dispatch:
    inputs:
      duckdb-sha:
        description: DuckDB commit SHA to test against
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ inputs.duckdb-sha }}
  cancel-in-progress: true

jobs:
  nightly:
    name: DuckDB nightly (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: libduckdb-linux-amd64.zip
          - name: macOS
            os: macos-latest
            artifact: libduckdb-osx-universal.zip
          - name: Windows
            os: windows-latest
            artifact: libduckdb-windows-amd64.zip
    runs-on: ${{ matrix.os }}
    env:
      DUCKDB_SHA: ${{ inputs.duckdb-sha }}
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # DuckDB's CMake build emits deep object paths that can exceed MAX_PATH
      # and fail with C1083. Keep Windows build output at the drive root.
      - name: Shorten Windows Cargo target directory
        if: ${{ runner.os == 'Windows' }}
        run: |
          case "$RUNNER_TEMP" in
            [A-Za-z]:[\\/]*) runner_drive=${RUNNER_TEMP%%:*} ;;
            *)
              echo "::error::Cannot derive a Windows drive from RUNNER_TEMP=$RUNNER_TEMP"
              exit 1
              ;;
          esac
          echo "CARGO_TARGET_DIR=$runner_drive:/t" >> "$GITHUB_ENV"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10

      - name: Upgrade bundled DuckDB to nightly commit
        id: upgrade
        run: ./upgrade.sh --sha "$DUCKDB_SHA"

      - name: Show generated upgrade diff
        if: ${{ !cancelled() }}
        run: |
          git status --short
          git diff --stat

      - name: Test bundled backend
        if: ${{ !cancelled() && steps.upgrade.outcome == 'success' }}
        # cc crate ignores CMAKE_*_COMPILER_LAUNCHER; wrap CC/CXX for sccache.
        # Step-scoped so CC/CXX do not leak into cmake backend steps.
        # cc treats empty CC/CXX values as unset, preserving Windows discovery.
        env:
          CC: ${{ runner.os != 'Windows' && 'sccache cc' || '' }}
          CXX: ${{ runner.os != 'Windows' && 'sccache c++' || '' }}
        run: cargo test -p duckdb --features bundled

      - name: Test bundled-cmake backend
        if: ${{ !cancelled() && steps.upgrade.outcome == 'success' }}
        run: cargo test -p duckdb --features bundled-cmake

      - name: Download nightly artifact
        id: artifact
        if: ${{ !cancelled() && steps.upgrade.outcome == 'success' }}
        run: |
          staging_key_length=10
          staging_key=${DUCKDB_SHA:0:$staging_key_length}
          artifact_name="${{ matrix.artifact }}"
          artifact_url="https://duckdb-staging.duckdb.org/$staging_key/duckdb/duckdb/github_release/$artifact_name"
          artifact_path="$RUNNER_TEMP/$artifact_name"
          library_path="$RUNNER_TEMP/libduckdb"
          curl --fail --location --retry 5 --output "$artifact_path" "$artifact_url" || {
            echo "::error::No staging artifact at $artifact_url"
            exit 1
          }
          unzip -q "$artifact_path" -d "$library_path"
          {
            echo "DUCKDB_LIB_DIR=$library_path"
            echo "DUCKDB_INCLUDE_DIR=$library_path"
          } >> "$GITHUB_ENV"
          case "$RUNNER_OS" in
            Linux)
              echo "LD_LIBRARY_PATH=$library_path${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
              ;;
            macOS)
              # SIP strips DYLD_* when /bin/bash starts a step, so GITHUB_ENV
              # cannot carry a runtime library path here. Bake in an rpath at
              # link time instead; libduckdb.dylib installs as @rpath/....
              echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,$library_path${RUSTFLAGS:+ $RUSTFLAGS}" >> "$GITHUB_ENV"
              ;;
            Windows)
              echo "$library_path" >> "$GITHUB_PATH"
              ;;
            *)
              echo "::error::Unsupported runner OS: $RUNNER_OS"
              exit 1
              ;;
          esac

      - name: Test nightly artifact and extensions
        if: ${{ !cancelled() && steps.artifact.outcome == 'success' }}
        # tests/nightly.rs holds exactly the ignored tests this workflow exists
        # to run. Selecting them with --ignored keeps a mistyped name from
        # passing silently, which is what an --exact filter would do.
        run: |
          cargo test -p duckdb --features buildtime_bindgen --test nightly -- --ignored
          cargo test -p duckdb --features buildtime_bindgen
