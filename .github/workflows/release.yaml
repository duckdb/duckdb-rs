name: Release

on:
  push:
    tags: ["*"]
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
jobs:
  ci:
    name: CI
    uses: ./.github/workflows/rust.yaml

  release:
    name: Cargo Publish
    # Publishing skips cargo's verification build, so only publish a commit that passed CI.
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: publish crates
        uses: katyo/publish-crates@v2
        with:
          path: "./"
          args: --no-verify --allow-dirty
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ignore-unpublished-changes: true

# NOTE: After running this action, manually create a new release via https://github.com/duckdb/duckdb-rs/releases/new
# TODO: Automate the entire release process
