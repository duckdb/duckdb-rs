[package]
name = "duckdb-neo"
description = "Ergonomic wrapper for DuckDB's v2 C API (experimental)"
version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = "https://docs.rs/duckdb-neo/"
categories = { workspace = true }
keywords = { workspace = true }
readme = "README.md"
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
name = "duckdb_neo"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[features]
default = ["buildtime-download", "buildtime-pkg-config", "buildtime-pregenerated"]
# Features
chrono = ["dep:chrono"]
r2d2 = ["dep:r2d2"]
uuid = ["dep:uuid"]
rust_decimal = ["dep:rust_decimal"]

# Buildtime features
# Where to find a prebuilt libduckdb. Not needed with `bundled`; opt out with `default-features = false`.
buildtime-download = ["libduckdb-sys/download-lib"]
buildtime-pkg-config = ["libduckdb-sys/pkg-config"]

# Compatibility marker only; pregenerated bindings are used without `buildtime-bindgen`.
buildtime-pregenerated = []
# Needs libclang and duckdb_v2.h (see DUCKDB_INCLUDE_DIR).
buildtime-bindgen = ["libduckdb-sys/buildtime_bindgen"]

bundled = ["libduckdb-sys/bundled"]
bundled-json = ["bundled", "libduckdb-sys/json"]
bundled-parquet = ["bundled", "libduckdb-sys/parquet"]

bundled-cmake = ["bundled", "libduckdb-sys/bundled-cmake"]
# Extensions statically linked through the CMake build backend.
bundled-cmake-autocomplete = ["bundled-cmake", "libduckdb-sys/autocomplete"]
bundled-cmake-httpfs = ["bundled-cmake", "libduckdb-sys/httpfs"]
bundled-cmake-icu = ["bundled-cmake", "libduckdb-sys/icu"]
bundled-cmake-tpcds = ["bundled-cmake", "libduckdb-sys/tpcds"]
bundled-cmake-tpch = ["bundled-cmake", "libduckdb-sys/tpch"]

build-extension = ["libduckdb-sys/loadable-extension-v2", "buildtime-bindgen"]
build-extension-static = []

[dependencies]
chrono = { workspace = true, optional = true }
duckdb-loadable-macros = { workspace = true, features = ["neo"] }
libduckdb-sys = { workspace = true, features = ["capi-v2"] }
paste = { workspace = true }
r2d2 = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
arrow-array = { workspace = true, features = ["ffi"] }
tempfile = { workspace = true }

[package.metadata.docs.rs]
features = ["chrono", "r2d2", "rust_decimal", "uuid"]
all-features = false
no-default-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []

[[example]]
name = "002-extension"
crate-type = ["cdylib"]
required-features = ["build-extension"]