[package]
name = "duckdb-neo"
description = "Ergonomic wrapper for DuckDB's v2 C API (experimental)"
version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = "https://docs.rs/duckdb-neo/"
categories = { workspace = true }
keywords = { workspace = true }
readme = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
name = "duckdb_neo"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[features]
default = []
# Features
r2d2 = ["dep:r2d2"]
uuid = ["dep:uuid"]

# Buildtime features 
bundled = ["libduckdb-sys/bundled"]

# Generate the v2 bindings with bindgen at build time instead of using the pregenerated ones.
# Needs libclang and duckdb_v2.h (see DUCKDB_INCLUDE_DIR).
buildtime-bindgen = ["libduckdb-sys/buildtime_bindgen"]

bundled-cmake = ["bundled", "libduckdb-sys/bundled-cmake"]
# Extensions statically linked through the CMake build backend.
bundled-cmake-autocomplete = ["bundled-cmake", "libduckdb-sys/autocomplete"]
bundled-cmake-httpfs = ["bundled-cmake", "libduckdb-sys/httpfs"]
bundled-cmake-icu = ["bundled-cmake", "libduckdb-sys/icu"]
bundled-cmake-tpcds = ["bundled-cmake", "libduckdb-sys/tpcds"]
bundled-cmake-tpch = ["bundled-cmake", "libduckdb-sys/tpch"]


[dependencies]
libc = { workspace = true }
# Not inherited from the workspace: cargo does not allow overriding
# `default-features` on an inherited dependency. Only the v2 bindings are
# needed; keep the library-discovery defaults. upgrade.sh bumps the version pin.
libduckdb-sys = { version = "=1.20000.0", path = "../libduckdb-sys", default-features = false, features = ["capi-v2", "pkg-config", "vcpkg", "download-lib"] }
paste = { workspace = true }
r2d2 = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[package.metadata.docs.rs]
features = []
all-features = false
no-default-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []
