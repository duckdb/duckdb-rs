[package]
name = "libduckdb-sys"
version = "2.0.0"
edition = "2024"
links = "duckdb"

[features]
# Statically link the self-contained libduckdb_static.a (no runtime dylib dependency).
# Default (feature off) links libduckdb.dylib dynamically and embeds rpaths.
bundled = []

[dependencies]

[build-dependencies]
bindgen = "0.71.0"
dotenv = "0.15.0"
pkg-config = "0.3"
vcpkg = "0.2"
