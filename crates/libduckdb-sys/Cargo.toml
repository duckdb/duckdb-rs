[package]
name = "libduckdb-sys"
description = "Native bindings to the libduckdb library V2 C API"
# ---
version = { workspace = true }
authors = { workspace = true }
categories = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
readme = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
links = "duckdb"

[features]
# Statically link the self-contained libduckdb_static.a (no runtime dylib dependency).
# Default (feature off) links libduckdb.dylib dynamically and embeds rpaths.
bundled = []

[dependencies]

[build-dependencies]
bindgen = "0.71.0"
dotenv = "0.15.0"
pkg-config = "0.3"
vcpkg = "0.2"
